[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-video-agent"
version = "0.1.0"
description = "Bilibili video search and timestamped evidence for Codex and other agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
media = [
    "pywhispercpp>=1.5.1,<2",
    "imageio-ffmpeg>=0.6,<1",
]

[project.scripts]
bili-video = "bili_video_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bili_video_agent*"]
