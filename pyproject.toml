[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-video-agent"
version = "0.1.0"
description = "Bilibili video search and timestamped evidence for Codex and other agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
media = [
    "faster-whisper>=1.1,<2",
    "imageio-ffmpeg>=0.6,<1",
    # Newer Windows wheels crashed during CPU model initialization on the tested host.
    "ctranslate2==4.6.0; sys_platform == 'win32'",
    # CTranslate2 4.6.0 imports pkg_resources, removed in setuptools 82.
    "setuptools>=68,<82; sys_platform == 'win32'",
]

[project.scripts]
bili-video = "bili_video_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bili_video_agent*"]
